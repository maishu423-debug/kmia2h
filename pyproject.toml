[project]
name = "kmia2h"
version = "0.2.0"
description = "KMIA 2-hour high/low probabilistic model (SPEC.md)."
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy", "pandas", "pyarrow", "duckdb", "scipy", "statsmodels", "scikit-learn", "lightgbm",
  "xarray", "netCDF4", "h5py", "cfgrib", "eccodes", "s3fs", "herbie-data", "pvlib", "pyproj",
  "ruptures", "requests", "tenacity", "pyyaml", "matplotlib", "pytest",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kmia2h*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
