[project]
name = "kmia2h"
version = "0.2.0"
description = "KMIA 2-hour high/low probabilistic model (SPEC.md)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy",
  "pandas",
  "pyarrow",
  "duckdb",
  "scipy",
  "statsmodels",
  "scikit-learn",
  "lightgbm",
  "xarray",
  "netCDF4",
  "h5py",
  "cfgrib",
  "eccodes",
  "s3fs",
  "herbie-data",
  "pvlib",
  "pyproj",
  "ruptures",
  "requests",
  "tenacity",
  "pyyaml",
  "matplotlib",
  "pytest",
  "tabulate>=0.10.0",
]

[project.optional-dependencies]
# The live website (site/backend): Django API, Kalshi paper trading, Google Sheets logging.
site = [
  "Django==6.0.6",
  "cryptography==49.0.0",
  "gunicorn",
  "gspread==6.2.1",
  "google-auth==2.56.0",
  "websockets==16.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kmia2h*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
